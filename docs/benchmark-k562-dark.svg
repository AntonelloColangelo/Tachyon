<text x="556.9" y="395" font-size="13" font-weight="600" fill="#f0efec">32.92 GiB</text>
<path d="M24.0,406.0 H620.0 Q624.0,406.0 624.0,410.0 V424.0 Q624.0,428.0 620.0,428.0 H24.0 Z" fill="#d95926"><title>37.63 GiB</title></path>
<text x="632.0" y="421" font-size="13" font-weight="600" fill="#f0efec">37.63 GiB</text>
<text x="24" y="454" font-size="12" fill="#c3c2b7">Private anonymous memory</text>
<path d="M24.0,460.0 H544.1 Q548.1,460.0 548.1,464.0 V478.0 Q548.1,482.0 544.1,482.0 H24.0 Z" fill="#3987e5"><title>32.87 GiB</title></path>
