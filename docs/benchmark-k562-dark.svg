<text x="632.0" y="305" font-size="13" font-weight="600" fill="#f0efec">205,381</text>
<line x1="24" y1="328" x2="836" y2="328" stroke="#33332f" stroke-width="1"/>
<text x="24" y="348" font-size="15" font-weight="600" fill="#f0efec">Memory</text>
<text x="90" y="348" font-size="12" fill="#9a998f">GiB, lower is better</text>
<text x="24" y="374" font-size="12" fill="#c3c2b7">Peak RSS (includes mapped index pages)</text>
