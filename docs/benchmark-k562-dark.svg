<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 566" width="860" height="566" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Tachyon vs STAR 2.7.11b benchmark on ENCODE K562</title>
<desc id="d">STAR: 113.59 s, 44,018 read pairs/s, 32.92 GiB peak RSS, 32.87 GiB anonymous. Tachyon 0.4: 24.345 s, 205,381 read pairs/s, 37.63 GiB peak RSS, 5.05 GiB anonymous.</desc>
<rect width="860" height="566" rx="8" fill="#1a1a19"/>
<text x="24" y="34" font-size="20" font-weight="600" fill="#f0efec">Tachyon vs STAR 2.7.11b: 4.7× faster on the same RNA-seq input</text>
<text x="24" y="56" font-size="13" fill="#c3c2b7">ENCODE K562, first 5 million read pairs, GRCh38 + Ensembl 115, 16 threads, warm cache, median of 2 runs</text>
<rect x="24" y="72" width="12" height="12" rx="3" fill="#3987e5"/>
<text x="42" y="83" font-size="13" fill="#c3c2b7">STAR 2.7.11b</text>
<rect x="174" y="72" width="12" height="12" rx="3" fill="#d95926"/>
<text x="192" y="83" font-size="13" fill="#c3c2b7">Tachyon 0.4</text>
<line x1="24" y1="96" x2="836" y2="96" stroke="#33332f" stroke-width="1"/>
<text x="24" y="116" font-size="15" font-weight="600" fill="#f0efec">Wall time</text>
<text x="117" y="116" font-size="12" fill="#9a998f">seconds, lower is better</text>
<text x="24" y="142" font-size="12" fill="#c3c2b7">Alignment of 5M read pairs</text>
<path d="M24.0,148.0 H620.0 Q624.0,148.0 624.0,152.0 V166.0 Q624.0,170.0 620.0,170.0 H24.0 Z" fill="#3987e5"><title>113.6 s</title></path>
<text x="632.0" y="163" font-size="13" font-weight="600" fill="#f0efec">113.6 s</text>
<path d="M24.0,174.0 H148.6 Q152.6,174.0 152.6,178.0 V192.0 Q152.6,196.0 148.6,196.0 H24.0 Z" fill="#d95926"><title>24.3 s</title></path>
<text x="160.6" y="189" font-size="13" font-weight="600" fill="#f0efec">24.3 s</text>
<line x1="24" y1="212" x2="836" y2="212" stroke="#33332f" stroke-width="1"/>
<text x="24" y="232" font-size="15" font-weight="600" fill="#f0efec">Throughput</text>
<text x="126" y="232" font-size="12" fill="#9a998f">read pairs per second, higher is better</text>
<text x="24" y="258" font-size="12" fill="#c3c2b7">Read pairs per second</text>
<path d="M24.0,264.0 H148.6 Q152.6,264.0 152.6,268.0 V282.0 Q152.6,286.0 148.6,286.0 H24.0 Z" fill="#3987e5"><title>44,018</title></path>
