<text x="112.5" y="501" font-size="13" font-weight="600" fill="#f0efec">5.05 GiB</text>
<text x="24" y="534" font-size="11.5" fill="#9a998f">Author-run historical benchmark of Tachyon 0.4 (not 0.4.1); STAR reference runs were reused. Tachyon used Mmap and a 4 GiB auxiliary index table.</text>
<text x="24" y="551" font-size="11.5" fill="#9a998f">Output matched STAR: alignment records and splice junctions (fingerprints, 2/2 runs). Details: docs/benchmark-k562.md</text>
